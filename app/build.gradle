apply plugin: 'com.android.application'

// Pass -PappName="Your Event Name" to customize the launcher label at build time.
def appDisplayName = providers.gradleProperty('appName')
        .getOrElse("Dean's 11th Birthday Blaster Bash")

// Keep release signing credentials outside version control. Command-line -P properties
// take precedence over an ignored release.properties file in the project root.
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('release.properties')
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseProperty = { String name ->
    project.findProperty(name) ?: releaseProperties.getProperty(name)
}
def releaseStoreFilePath = releaseProperty('releaseStoreFile')
def releaseStorePassword = releaseProperty('releaseStorePassword')
def releaseKeyAlias = releaseProperty('releaseKeyAlias')
def releaseKeyPassword = releaseProperty('releaseKeyPassword')
def releaseSigningConfigured = [releaseStoreFilePath, releaseStorePassword,
        releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

if ([releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .any { it != null && !it.trim().isEmpty() } && !releaseSigningConfigured) {
    throw new GradleException('Release signing needs releaseStoreFile, releaseStorePassword, '
            + 'releaseKeyAlias, and releaseKeyPassword.')
}
if (releaseSigningConfigured && !rootProject.file(releaseStoreFilePath).isFile()) {
    throw new GradleException("Release keystore not found: ${releaseStoreFilePath}")
}

android {
    compileSdk 34
    compileOptions {
        // The QR library uses Java 8 collection APIs (for example List.sort).
        // Backport them so the stated Android 5.0 minimum remains real.
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.simplecoil.simplecoil"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 19
        versionName "1.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appName: appDisplayName]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured)
                signingConfig signingConfigs.release
        }
    }
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    namespace 'com.simplecoil.simplecoil'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation(name: 'WhirlyGlobeMaply', ext: 'aar')
    // The bundled AAR has no dependency metadata and uses the OkHttp 2 API.
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
